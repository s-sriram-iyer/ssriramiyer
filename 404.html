<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <link rel="stylesheet" href="/css/index.css" />
    <script src="https://kit.fontawesome.com/e511948eb3.js" crossorigin="anonymous"></script>
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <noscript>
      <style>
        @media (prefers-color-scheme: dark) {
          :root {
            --bg: #1c1917;
            --text: #fafaf9;
            --text-secondary: #a8a29e;
            --link: #60a5fa;
            --link-hover: #93bbfd;
            --border: #44403c;
            --code-bg: #292524;
            --code-text: #d6d3d1;
            --code-block-bg: #292524;
            --code-block-text: #d6d3d1;
            --tag-bg: #292524;
            --tag-text: #d6d3d1;
            --blockquote-border: #57534e;
            --selection-bg: #60a5fa;
            --selection-text: #1c1917;
            --hover-bg: #292524;
            --accent: #60a5fa;
            color-scheme: dark;
          }
        }
  </style>
    </noscript>
  </head>

  <body>
    <main class="container">
      <!-- Welcome! --> <section class="hero"><h1 class="hero-name">404: You found a non-existent page!</h1></section>
    </main>
  </body>
</html>
